name: release

# A tag publishes the package to npm with provenance. The published artifact is
# source: `bin` points at `src/main.ts`, so `bunx foreverdb-mcp` runs it with no
# build step and there is no platform matrix and no checksum file.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foreverdb-mcp
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bunx biome check .
          bunx tsc --noEmit
          bun test

      - name: Publish
        run: npm publish --provenance --access public
