[workspace]
resolver = "3"
members = ["foreverdb-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
overflow-checks = true
