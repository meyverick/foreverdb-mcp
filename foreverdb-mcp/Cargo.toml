[package]
name = "foreverdb-mcp"
description = "MCP server exposing the ForeverDB API to LLM clients"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "foreverdb_mcp"
path = "src/lib.rs"

[[bin]]
name = "foreverdb"
path = "src/main.rs"

[dependencies]
governor = "0.10"
reqwest = "0.13"
rmcp = { version = "3.8", features = ["client", "macros", "server", "schemars", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net"] }
