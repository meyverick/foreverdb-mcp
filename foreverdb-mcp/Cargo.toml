[package]
name = "foreverdb-mcp"
description = "MCP server exposing the ForeverDB API to LLM clients"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository = "https://github.com/meyverick/foreverdb-mcp"
homepage = "https://github.com/meyverick/foreverdb-mcp"
documentation = "https://github.com/meyverick/foreverdb-mcp/tree/main/foreverdb-mcp#readme"
keywords = ["mcp", "llm", "warcraft", "foreverdb", "wow"]
categories = ["api-bindings", "command-line-utilities"]

# Prebuilt binary lookup for `cargo binstall foreverdb-mcp`. Asset names carry no
# version so the same files serve both the versioned tag URL and
# releases/latest/download used by scripts/install.sh.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-fmt = "zip"

[lints]
workspace = true

[lib]
name = "foreverdb_mcp"
path = "src/lib.rs"

[[bin]]
name = "foreverdb"
path = "src/main.rs"

[dependencies]
governor = "0.10"
reqwest = "0.13"
rmcp = { version = "3.8", features = ["client", "macros", "server", "schemars", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net"] }
